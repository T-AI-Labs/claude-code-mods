<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 428" width="882" height="428" role="img" aria-labelledby="t d">
  <title id="t">The catalog pane listing skills</title>
  <desc id="d">Illustration. Tabs for Skills, Commands, Agents, Mods, Plugins, Hooks, MCP servers and Tools with their counts, a filter field, Sort set to Most used and From set to Everywhere, and five skills with their origin, how often they were used and their token cost per session.</desc>
  <rect width="882" height="428" rx="12" fill="#0b0b0b"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">
    <text x="28" y="38" fill="#e8e8e8" font-weight="600" font-size="15">Catalog</text><line x1="0" y1="56.5" x2="882" y2="56.5" stroke="#333333"/>
    <rect x="28" y="74" width="91" height="26" rx="6" fill="#e8e8e8"/><text x="73.5" y="91.5" fill="#0b0b0b" text-anchor="middle">Skills 24</text><rect x="127.5" y="74.5" width="104" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="179.5" y="91.5" fill="#e8e8e8" text-anchor="middle">Commands 18</text><rect x="240.5" y="74.5" width="82" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="281.5" y="91.5" fill="#e8e8e8" text-anchor="middle">Agents 9</text><rect x="331.5" y="74.5" width="67" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="365.0" y="91.5" fill="#e8e8e8" text-anchor="middle">Mods 3</text><rect x="407.5" y="74.5" width="97" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="456.0" y="91.5" fill="#e8e8e8" text-anchor="middle">Plugins 12</text><rect x="513.5" y="74.5" width="75" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="551.0" y="91.5" fill="#e8e8e8" text-anchor="middle">Hooks 4</text><rect x="597.5" y="74.5" width="60" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="627.5" y="91.5" fill="#e8e8e8" text-anchor="middle">MCP 5</text><rect x="666.5" y="74.5" width="82" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="707.5" y="91.5" fill="#e8e8e8" text-anchor="middle">Tools 21</text><text x="763" y="91.5" fill="#8c8c8c">Refresh</text>
    <text x="28" y="133.5" fill="#8c8c8c">Filter</text><rect x="80.5" y="116.5" width="219" height="25" rx="6" fill="#151515" stroke="#4a4a4a"/><text x="90" y="133.5" fill="#6e6e6e">name or description</text>
    <text x="320" y="133.5" fill="#8c8c8c">Sort</text><rect x="358.5" y="116.5" width="149" height="25" rx="6" fill="#151515" stroke="#4a4a4a"/><text x="368" y="133.5" fill="#e8e8e8">Most used</text><path d="M490 127 l4 5 l4 -5 z" fill="#e8e8e8"/>
    <text x="528" y="133.5" fill="#8c8c8c">From</text><rect x="566.5" y="116.5" width="149" height="25" rx="6" fill="#151515" stroke="#4a4a4a"/><text x="576" y="133.5" fill="#e8e8e8">Everywhere</text><path d="M698 127 l4 5 l4 -5 z" fill="#e8e8e8"/>
    <text x="28" y="178"><tspan fill="#e8e8e8" font-weight="600">code-review</tspan><tspan fill="#8c8c8c"> built-in · 42× (11 in 30d)</tspan></text>
    <text x="28" y="197" fill="#6e6e6e">Review the current diff for correctness bugs at a chosen effort level.</text>
    <text x="28" y="230"><tspan fill="#e8e8e8" font-weight="600">pdf</tspan><tspan fill="#8c8c8c"> anthropic-skills · 17× (6 in 30d) · ~95 tok/session</tspan></text>
    <text x="28" y="249" fill="#6e6e6e">Read, create, merge, split and fill PDF files.</text>
    <text x="28" y="282"><tspan fill="#e8e8e8" font-weight="600">release-notes</tspan><tspan fill="#8c8c8c"> user · 9× (3 in 30d)</tspan></text>
    <text x="28" y="301" fill="#6e6e6e">Draft release notes from the commits since the last tag.</text>
    <text x="28" y="334"><tspan fill="#e8e8e8" font-weight="600">simplify</tspan><tspan fill="#8c8c8c"> built-in · 4× (1 in 30d)</tspan></text>
    <text x="28" y="353" fill="#6e6e6e">Review the changed code for reuse and simplification, then apply the fixes.</text>
    <text x="28" y="386"><tspan fill="#e8e8e8" font-weight="600">xlsx</tspan><tspan fill="#8c8c8c"> anthropic-skills · never used · ~110 tok/session</tspan></text>
    <text x="28" y="405" fill="#6e6e6e">Open, edit and create spreadsheets with formulas and charts.</text>
  </g>
</svg>
