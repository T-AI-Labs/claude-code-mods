<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 894 504" width="894" height="504" role="img" aria-labelledby="t d">
  <title id="t">The task board in the terminal</title>
  <desc id="d">Recreated from the text Claude Code prints in a terminal, with sample figures. The tabs Board, in the accent color, and Snippets, the Scope dropdown set to claude-code-mods with the key CCM, a field for a new task, and four lanes side by side: Ideas with two tasks, Todo with three led by an urgent one, In progress with one, and Done with the two most recent of five. Each card has a rounded border and shows its key, its priority, its title, arrows to move it and its age.</desc>
