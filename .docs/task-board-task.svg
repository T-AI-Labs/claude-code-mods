<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 410" width="882" height="410" role="img" aria-labelledby="t d">
  <title id="t">A task on the task board</title>
  <desc id="d">Illustration. The task CCM-12 open for editing: a back button to the board, the Title and Details fields, the Status dropdown set to Todo and the Priority dropdown set to Urgent, and the buttons Save, Insert and Delete.</desc>
  <rect width="882" height="410" rx="12" fill="#1a1a1a"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">
    <text x="28" y="38" fill="#e8e8e8" font-weight="600" font-size="15">Task board</text><line x1="0" y1="56.5" x2="882" y2="56.5" stroke="#333333"/>
    <rect x="28.5" y="74.5" width="70" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="63.5" y="91.5" fill="#e8e8e8" text-anchor="middle">‹ Board</text>
    <text x="114" y="91.5" fill="#e8e8e8" font-weight="600">CCM-12</text><text x="176" y="91.5" fill="#8c8c8c">created 2d · updated today</text>
    <text x="28" y="130.5" fill="#8c8c8c">Title</text>
    <rect x="88.5" y="112.5" width="765" height="27" rx="6" fill="none" stroke="#4a4a4a"/><text x="100" y="130.5" fill="#e8e8e8">Submit the gallery to awesome-claude-code</text>
    <text x="28" y="172" fill="#8c8c8c">Details</text>
    <rect x="88.5" y="154.5" width="765" height="150" rx="6" fill="none" stroke="#4a4a4a"/>
    <text x="100" y="174" fill="#e8e8e8">Submit through the web form, one entry at a time.</text>
    <text x="100" y="194" fill="#e8e8e8">Category: Lists and Collections.</text>
    <text x="100" y="214" fill="#e8e8e8">Leave the form's last checkbox unchecked.</text>
    <text x="100" y="234" fill="#e8e8e8">Possible from November 16, when the repository is 14 days old.</text>
    <rect x="28.5" y="318.5" width="130" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="40" y="335.5" fill="#e8e8e8"><tspan fill="#8c8c8c">Status</tspan> Todo</text><path d="M139.5 328.5 l4 5 l4 -5 z" fill="#e8e8e8"/>
    <rect x="170.5" y="318.5" width="150" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="182" y="335.5" fill="#e8e8e8"><tspan fill="#8c8c8c">Priority</tspan> <tspan fill="#e5534b">Urgent</tspan></text><path d="M301.5 328.5 l4 5 l4 -5 z" fill="#e8e8e8"/>
    <rect x="28" y="356" width="52" height="26" rx="6" fill="#e8e8e8"/><text x="54" y="373.5" fill="#1a1a1a" text-anchor="middle">Save</text>
    <rect x="88.5" y="356.5" width="60" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="118.5" y="373.5" fill="#e8e8e8" text-anchor="middle">Insert</text>
    <rect x="156.5" y="356.5" width="60" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="186.5" y="373.5" fill="#e8e8e8" text-anchor="middle">Delete</text>
  </g>
</svg>
