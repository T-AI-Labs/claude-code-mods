    <text x="132" y="436" fill="#8c8c8c" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12">Assert.Equal() Failure: Expected 0, Actual 1</text>
    <text x="28" y="470" fill="#4ec27a">✓</text><text x="52" y="470" fill="#e8e8e8" font-weight="600">pytest</text><text x="760" y="470" fill="#8c8c8c" text-anchor="end">3.4 s</text>
    <text x="28" y="494" fill="#4ec27a">✓</text><text x="68" y="494" fill="#e8e8e8">▸ tools</text><text x="124" y="494" fill="#8c8c8c">5 tests</text><text x="760" y="494" fill="#8c8c8c" text-anchor="end">3.4 s</text><text x="780" y="494" fill="#e8e8e8">▶ Run</text>
    <text x="28" y="528" fill="#4ec27a">✓</text><text x="52" y="528" fill="#e8e8e8" font-weight="600">Claude Code mods</text><text x="760" y="528" fill="#8c8c8c" text-anchor="end">6.6 s</text>
    <text x="28" y="552" fill="#4ec27a">✓</text><text x="68" y="552" fill="#e8e8e8">▸ catalog-pane</text><text x="166" y="552" fill="#8c8c8c">24 tests</text><text x="760" y="552" fill="#8c8c8c" text-anchor="end">5.8 s</text><text x="780" y="552" fill="#e8e8e8">▶ Run</text>
    <text x="28" y="576" fill="#4ec27a">✓</text><text x="68" y="576" fill="#e8e8e8">▸ task-board</text><text x="152" y="576" fill="#8c8c8c">6 tests</text><text x="760" y="576" fill="#8c8c8c" text-anchor="end">0.8 s</text><text x="780" y="576" fill="#e8e8e8">▶ Run</text>
