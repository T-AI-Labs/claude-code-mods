<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 567" width="882" height="567" role="img" aria-labelledby="t d">
  <title id="t">The Claude tab of the catalog pane</title>
  <desc id="d">Illustration. The Claude tab: Claude Code 2.1.322 with its build date and the latest version 2.1.328, where it runs, the model, the default permission mode and output style, the settings and project folders, how many plugins are enabled, an update notice, links to the docs, the changelog and the anthropics/claude-code repository with its stars, what the changelog says about 2.1.322, the first change of each of the five newer releases, and buttons for the built-in commands, agents and tools and for the ones of your own setup.</desc>
