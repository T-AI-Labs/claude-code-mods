<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 440" width="882" height="440" role="img" aria-labelledby="t d">
  <title id="t">The task board</title>
  <desc id="d">Illustration. The tabs Board and Snippets, the Scope dropdown set to claude-code-mods with the key CCM, a field for a new task, and four lanes: Ideas with two tasks, Todo with three led by an urgent one, In progress with one, and Done with the two most recent of five. Each card shows its key, its priority, its title, arrows to move it and its age.</desc>
  <rect width="882" height="440" rx="12" fill="#1a1a1a"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">
    <text x="28" y="38" fill="#e8e8e8" font-weight="600" font-size="15">Task board</text><line x1="0" y1="56.5" x2="882" y2="56.5" stroke="#333333"/>
    <rect x="28" y="74" width="58" height="26" rx="6" fill="#e8e8e8"/><text x="57" y="91.5" fill="#1a1a1a" text-anchor="middle">Board</text>
    <rect x="94.5" y="74.5" width="86" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="137.5" y="91.5" fill="#e8e8e8" text-anchor="middle">Snippets 2</text>
    <rect x="188.5" y="74.5" width="230" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="200" y="91.5" fill="#e8e8e8"><tspan fill="#8c8c8c">Scope</tspan> claude-code-mods · CCM</text><path d="M399.5 84.5 l4 5 l4 -5 z" fill="#e8e8e8"/>
    <rect x="28.5" y="112.5" width="825" height="27" rx="6" fill="none" stroke="#4a4a4a"/><text x="40" y="130.5" fill="#6e6e6e">New task, or idea: … or snippet: …</text>

    <text x="28" y="176" fill="#e8e8e8" font-weight="600">Ideas <tspan fill="#8c8c8c" font-weight="400">2</tspan></text>
    <rect x="28.5" y="188.5" width="194" height="66" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="40" y="208" fill="#8c8c8c">CCM-7</text>
    <text x="40" y="228" fill="#e8e8e8">Mod that parks thoughts</text>
    <text x="40" y="246" fill="#6e6e6e">▸</text><text x="210" y="246" fill="#8c8c8c" text-anchor="end">3d</text>
    <rect x="28.5" y="262.5" width="194" height="66" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="40" y="282" fill="#8c8c8c">CCM-9</text><text x="210" y="282" fill="#8c8c8c" text-anchor="end">Low</text>
    <text x="40" y="302" fill="#e8e8e8">Weekly cost digest</text>
    <text x="40" y="320" fill="#6e6e6e">▸</text><text x="210" y="320" fill="#8c8c8c" text-anchor="end">1w</text>

    <text x="238" y="176" fill="#e8e8e8" font-weight="600">Todo <tspan fill="#8c8c8c" font-weight="400">3</tspan></text>
    <rect x="238.5" y="188.5" width="194" height="66" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="250" y="208" fill="#8c8c8c">CCM-12</text><text x="420" y="208" fill="#e5534b" text-anchor="end">Urgent</text>
    <text x="250" y="228" fill="#e8e8e8">Submit the gallery</text>
    <text x="250" y="246" fill="#6e6e6e">◂ ▸</text><text x="420" y="246" fill="#8c8c8c" text-anchor="end">≡ today</text>
    <rect x="238.5" y="262.5" width="194" height="66" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="250" y="282" fill="#8c8c8c">CCM-14</text><text x="420" y="282" fill="#d4a72c" text-anchor="end">High</text>
    <text x="250" y="302" fill="#e8e8e8">Check the light theme</text>
    <text x="250" y="320" fill="#6e6e6e">◂ ▸</text><text x="420" y="320" fill="#8c8c8c" text-anchor="end">2d</text>
    <rect x="238.5" y="336.5" width="194" height="66" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="250" y="356" fill="#8c8c8c">CCM-15</text>
    <text x="250" y="376" fill="#e8e8e8">Keep-warm per project</text>
    <text x="250" y="394" fill="#6e6e6e">◂ ▸</text><text x="420" y="394" fill="#8c8c8c" text-anchor="end">today</text>

    <text x="448" y="176" fill="#e8e8e8" font-weight="600">In progress <tspan fill="#8c8c8c" font-weight="400">1</tspan></text>
    <rect x="448.5" y="188.5" width="194" height="66" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="460" y="208" fill="#8c8c8c">CCM-11</text><text x="630" y="208" fill="#e8e8e8" text-anchor="end">Medium</text>
    <text x="460" y="228" fill="#e8e8e8">Board view with lanes</text>
    <text x="460" y="246" fill="#6e6e6e">◂ ▸</text><text x="630" y="246" fill="#8c8c8c" text-anchor="end">≡ today</text>

    <text x="658" y="176" fill="#e8e8e8" font-weight="600">Done <tspan fill="#8c8c8c" font-weight="400">5</tspan></text>
    <rect x="658.5" y="188.5" width="194" height="66" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="670" y="208" fill="#8c8c8c">CCM-10</text>
    <text x="670" y="228" fill="#8c8c8c" text-decoration="line-through">Order the row</text>
    <text x="670" y="246" fill="#6e6e6e">◂</text><text x="840" y="246" fill="#8c8c8c" text-anchor="end">1d</text>
    <rect x="658.5" y="262.5" width="194" height="66" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="670" y="282" fill="#8c8c8c">CCM-8</text>
    <text x="670" y="302" fill="#8c8c8c" text-decoration="line-through">Reload after /clear</text>
    <text x="670" y="320" fill="#6e6e6e">◂</text><text x="840" y="320" fill="#8c8c8c" text-anchor="end">2d</text>
    <text x="658" y="352" fill="#8c8c8c">+3 older</text>
  </g>
</svg>
