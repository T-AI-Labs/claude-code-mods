  <title id="t">The usage pane in the terminal</title>
  <desc id="d">Recreated from the text Claude Code prints in a terminal, with sample figures. Tabs for Last turn, Session, Today, 7 days, 30 days, Sessions and Prompts, with 7 days in the accent color. The totals: 48.2M tokens split into input, output, cache read and cache write, a 94 percent cache hit rate, an API price of 61.40 dollars, 412 turns, 3180 tool calls, 6 hours 31 minutes of model time and an output speed of 81 tokens per second. Below them the tokens and price by model and by project, and the 5-hour and weekly limits with the current window and the peak of the last one.</desc>
