<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 576" width="882" height="576" role="img" aria-labelledby="t d">
  <title id="t">The usage pane</title>
  <desc id="d">Illustration. Tabs for Last turn, Session, Today, 7 days and 30 days, with 7 days selected. The totals: 48.2M tokens split into input, output, cache read and cache write, a 94 percent cache hit rate, an API price of 61.40 dollars, 412 turns and 3180 tool calls. Below them the tokens and price by model and by project, and the 5-hour and weekly limits with the current window and the peak of the last one.</desc>
  <rect width="882" height="576" rx="12" fill="#1a1a1a"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">
