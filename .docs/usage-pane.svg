    <text x="28" y="284" fill="#8c8c8c">claude-opus-5-5</text><text x="262" y="284" fill="#e8e8e8" text-anchor="end">41.0M</text><text x="274" y="284" fill="#8c8c8c">$57.10 · 95% cached</text>
    <text x="28" y="306" fill="#8c8c8c">claude-sonnet-5-5</text><text x="262" y="306" fill="#e8e8e8" text-anchor="end">6.9M</text><text x="274" y="306" fill="#8c8c8c">$4.10 · 90% cached</text>
    <text x="28" y="328" fill="#8c8c8c">claude-haiku-5-5</text><text x="262" y="328" fill="#e8e8e8" text-anchor="end">300k</text><text x="274" y="328" fill="#8c8c8c">$0.20 · 71% cached</text>
    <text x="28" y="366" fill="#e8e8e8" font-weight="600">By project</text>
    <text x="28" y="388" fill="#8c8c8c">claude-code-mods</text><text x="262" y="388" fill="#e8e8e8" text-anchor="end">30.2M</text><text x="274" y="388" fill="#8c8c8c">$38.90 · 95% cached</text>
    <text x="28" y="410" fill="#8c8c8c">open-event-viewer</text><text x="262" y="410" fill="#e8e8e8" text-anchor="end">14.8M</text><text x="274" y="410" fill="#8c8c8c">$18.60 · 93% cached</text>
    <text x="28" y="432" fill="#8c8c8c">dotfiles</text><text x="262" y="432" fill="#e8e8e8" text-anchor="end">3.2M</text><text x="274" y="432" fill="#8c8c8c">$3.90 · 88% cached</text>
