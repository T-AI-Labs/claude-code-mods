    <rect x="28.5" y="74.5" width="84" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="70.5" y="91.5" fill="#e8e8e8" text-anchor="middle">Last turn</text><rect x="121.5" y="74.5" width="76" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="159.5" y="91.5" fill="#e8e8e8" text-anchor="middle">Session</text><rect x="206.5" y="74.5" width="64" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="238.5" y="91.5" fill="#e8e8e8" text-anchor="middle">Today</text><rect x="279" y="74" width="70" height="26" rx="6" fill="#e8e8e8"/><text x="314" y="91.5" fill="#1a1a1a" text-anchor="middle">7 days</text><rect x="357.5" y="74.5" width="76" height="25" rx="6" fill="none" stroke="#4a4a4a"/><text x="395.5" y="91.5" fill="#e8e8e8" text-anchor="middle">30 days</text><text x="448" y="91.5" fill="#8c8c8c">Refresh</text>
    <text x="28" y="136" fill="#8c8c8c">Tokens</text><text x="262" y="136" fill="#e8e8e8" text-anchor="end">48.2M</text><text x="274" y="136" fill="#8c8c8c">input 310k · output 1.9M · cache read 44.1M · cache write 1.9M</text>
    <text x="28" y="158" fill="#8c8c8c">Cache hit rate</text><text x="262" y="158" fill="#e8e8e8" text-anchor="end">94%</text><text x="274" y="158" fill="#8c8c8c">of the prompt read from the cache</text>
