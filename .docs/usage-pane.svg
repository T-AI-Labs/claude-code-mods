    <text x="262" y="514" fill="#e8e8e8" text-anchor="end">81%</text><text x="274" y="514" fill="#8c8c8c">peak, reset Oct 31 09:00</text>
    <text x="28" y="536" fill="#8c8c8c">Weekly</text><text x="262" y="536" fill="#e8e8e8" text-anchor="end">64%</text><text x="274" y="536" fill="#8c8c8c">now, resets Nov 3 08:00 (in 2d 20h)</text>
    <text x="262" y="558" fill="#e8e8e8" text-anchor="end">58%</text><text x="274" y="558" fill="#8c8c8c">peak, reset Oct 27 08:00</text>
